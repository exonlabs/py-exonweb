[project]
name = "exonweb"
version = "7.2.dev"
description = "Simple lightweight framework and utils for web applications."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    { name = "exonlabs", email = "info@exonlabs.net" }
]
keywords = [
    "development",
    "utilities",
    "tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0,<4.0",
    "jinja2>=3.0,<4.0",
    "gunicorn>=25.0,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "flake8>=7.0,<8.0",
    "black>=26.0,<27.0",
    "colorama>=0.4,<1.0",
]
docs = [
    "mkdocs>=1.6,<2.0"
]

[project.urls]
Homepage = "https://github.com/exonlabs/py-exonweb"
Repository = "https://github.com/exonlabs/py-exonweb"
Documentation = "https://exonlabs.github.io/py-exonweb"

[build-system]
requires = ["setuptools>=82.0"]
build-backend = "setuptools.build_meta"
